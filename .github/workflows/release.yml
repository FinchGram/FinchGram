name: release

# A "Release v<version>" commit pushed to main (made by scripts/release.sh, with its v<version>
# tag) builds the app on clean Apple-silicon runners, keeps the result as an artifact for a week,
# and publishes it as a release of this repository, from which installed copies of the app update
# themselves (src/update.rs). Other pushes only run check.yml (clippy and the tests): since
# 2026-10-23, at the maintainer's word, no app is built for them. The run starts on the push to
# main rather than on the tag so that its Rust build cache is saved on the default branch, the only
# place caches are shared from: the next release starts warm. Nothing is ever built on a developer
# machine.
#
# Two jobs since 2026-10-26, the maintainer's choice. Compiling, nearly all of a release (53 to 94
# minutes on GitHub's free 3-core runner in October 2026), runs on a Blacksmith runner: an Apple M4
# with 6 cores, paid by the minute, with 150 free minutes a month. Signing, notarizing and
# publishing run on GitHub's own runner, so that the three keys (the Developer ID certificate,
# Apple's notary key, the update signing key) never reach a machine outside GitHub. The build job
# gets only the Telegram api_id and api_hash, which are in the app anyway. The Blacksmith app is
# installed on the FinchGram organization; rulesets let only the maintainer write branches and tags,
# so no other actor can put a workflow of its own where these secrets are (docs/conventions.md,
# Release first).
#
# Every Action is pinned to a commit (its full SHA, the version beside it), never to a tag or a
# branch, which can be moved: these jobs build, sign and publish what users install, and what runs
# here must be what was reviewed (docs/conventions.md, Release first). To update one, change the SHA.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Release builds run one after the other and are never cancelled. The runs of other pushes
  # (whose jobs are skipped below) get a group of their own: GitHub keeps only one pending run per
  # group, and one of them queued behind a release could otherwise push a pending release out.
  group: ${{ startsWith(github.event.head_commit.message, 'Release v') && 'release' || format('push-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  APP_NAME: FinchGram

jobs:
  # Compiles and bundles the app, signed ad hoc, and hands it to the publish job as an artifact.
  build:
    # Only the release commits, and a run started by hand.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: blacksmith-6vcpu-macos-latest # Apple M4, 6 cores, 24 GB
    permissions:
      contents: read
    # Every minute here is paid for: a warm build should take well under half an hour, a cold one
    # (no cache yet, or new dependencies) under an hour.
    timeout-minutes: 75
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      zip: ${{ steps.meta.outputs.zip }}
      symbols: ${{ steps.meta.outputs.symbols }}
      unsigned: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version and tag
        id: meta
        run: |
          git fetch --force --tags --quiet origin
          TAG="$(git tag --points-at HEAD | grep '^v[0-9]' | head -1 || true)"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match the version in Cargo.toml ($VERSION)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=FinchGram-$VERSION-macos-arm64.zip" >> "$GITHUB_OUTPUT" # the name the app looks for
          echo "symbols=finchgram-$VERSION-macos-arm64.dSYM.zip" >> "$GITHUB_OUTPUT" # its symbols (docs/crash-reports.md)
          echo "version $VERSION, tag ${TAG:-none}"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: finchgram-tdlib, pinned, from this repository's tdlib-* release
        run: scripts/fetch-tdlib.sh

      - name: libmpv, pinned, from this repository's mpv-* release
        run: scripts/fetch-mpv.sh

      - name: The UI fonts, pinned, from google/fonts
        run: scripts/fetch-fonts.sh

      # FinchGram's own api_id and api_hash from my.telegram.org, compiled into the app. They exist
      # only as secrets of this repository (docs/conventions.md, Telegram API credentials).
      - name: Build and bundle
        env:
          FINCHGRAM_API_ID: ${{ secrets.FINCHGRAM_API_ID }}
          FINCHGRAM_API_HASH: ${{ secrets.FINCHGRAM_API_HASH }}
        run: |
          if [ -z "$FINCHGRAM_API_ID" ] || [ -z "$FINCHGRAM_API_HASH" ]; then
            echo "::error::secrets FINCHGRAM_API_ID and FINCHGRAM_API_HASH are missing (docs/conventions.md)"
            exit 1
          fi
          scripts/bundle.sh # signed ad hoc: the publish job signs it with the Developer ID

      # The symbols too: cargo packed the names and line tables of this very binary into
      # finchgram.dSYM next to it (Cargo.toml, [profile.release]), which is what reads a crash report
      # of this release (docs/crash-reports.md). The app stays stripped.
      - name: Symbols
        run: |
          [ -d target/release/finchgram.dSYM ] || { echo "::error::target/release/finchgram.dSYM is missing: did the build pack the symbols (Cargo.toml, split-debuginfo)?"; exit 1; }
          # cargo's finchgram.dSYM is a link to deps/finchgram-<hash>.dSYM, the DWARF file inside
          # named the same; the release gets a plain copy with the file named finchgram.
          rm -rf dist/finchgram.dSYM
          ditto "target/release/$(readlink target/release/finchgram.dSYM || echo finchgram.dSYM)" dist/finchgram.dSYM
          DWARF="$(ls dist/finchgram.dSYM/Contents/Resources/DWARF/)"
          [ "$(echo "$DWARF" | wc -l)" -eq 1 ] || { echo "::error::finchgram.dSYM holds more than one file: $DWARF"; exit 1; }
          mv "dist/finchgram.dSYM/Contents/Resources/DWARF/$DWARF" dist/finchgram.dSYM/Contents/Resources/DWARF/finchgram

      # tar keeps the bundle as it is (its links and modes), which an artifact's own zip would not;
      # COPYFILE_DISABLE keeps macOS's ._ files out of it.
      - name: Pack
        run: COPYFILE_DISABLE=1 tar -czf dist/unsigned.tar.gz -C dist "$APP_NAME.app" finchgram.dSYM

      # Artifacts count against the organization's 0.5 GB of Actions storage, measured by the hour
      # (2026-10-26: a week of release copies, 4.2 GB, used 90% of a month's): this one lives only
      # until the publish job is done with it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: unsigned
        with:
          name: unsigned
          path: dist/unsigned.tar.gz
          if-no-files-found: error
          compression-level: 0 # gzipped already
          retention-days: 1

  # Signs the app with the Developer ID, has Apple notarize it, signs the update and publishes it.
  publish:
    needs: build
    runs-on: macos-latest # GitHub's own, Apple silicon
    permissions:
      contents: write # gh release create needs it; the default token is read-only
      actions: write # to delete the build job's artifact once done
    # Signing takes a minute; the rest is Apple's notarization, which may take up to 45 (below).
    timeout-minutes: 75
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      ZIP: ${{ needs.build.outputs.zip }}
      SYMBOLS: ${{ needs.build.outputs.symbols }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: dist

      - name: Unpack
        run: |
          tar -xzf dist/unsigned.tar.gz -C dist
          rm dist/unsigned.tar.gz
          ls -la dist

      # For the update signing tool alone (crates/finchgram-release-sign/), a minute to build.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable

      # The app is signed with North Brookville LLC's Developer ID Application certificate, the
      # same for every release: macOS ties what the user allowed the app (Screen Recording, for the
      # screenshot tool) to the signature's team, so permissions stay across updates, and once
      # notarized (below) a downloaded copy opens without Gatekeeper's question. The certificate
      # and its key exist only as secrets of this repository, with a backup in the maintainer's
      # login keychain (docs/conventions.md, Release first). Without them (a fork) the app is
      # signed ad hoc.
      - name: Signing identity
        id: identity
        env:
          CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CODESIGN_CERTIFICATE" ]; then
            echo "::warning::secret CODESIGN_CERTIFICATE is missing: the app is signed ad hoc, and macOS forgets its permissions at every update (docs/conventions.md)"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/finchgram.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # It locks itself only after six hours, longer than the job may run: when v0.7.0's first
          # run compiled for 88 minutes, the keychain locked at the hour and codesign waited for its
          # password until the job was cancelled.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CODESIGN_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/finchgram.p12"
          # The .p12 carries Apple's Developer ID G2 intermediate certificate too, so that the chain
          # up to Apple's root (in every macOS) is complete on a clean runner.
          security import "$RUNNER_TEMP/finchgram.p12" -k "$KEYCHAIN" -P "$CODESIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/finchgram.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '" ')
          security find-identity -v -p codesigning "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/^ *1) [0-9A-F]* "\(.*\)"$/\1/p')"
          if [ -z "$IDENTITY" ] || ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q '1 valid identities found'; then
            echo "::error::the signing certificate cannot be used (is its chain complete?)"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signing as $IDENTITY"

      - name: Sign the app
        env:
          SIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          scripts/sign.sh "dist/$APP_NAME.app"
          # Signed with the certificate, the app's designated requirement names it, not this build.
          if [ "$SIGN_IDENTITY" != "-" ] && codesign -d -r- "dist/$APP_NAME.app" 2>&1 | grep -q cdhash; then
            echo "::error::the app is signed per build (cdhash), not with the certificate"
            exit 1
          fi

      # Notarization: Apple scans the signed app and issues a ticket, stapled into the bundle, so
      # that Gatekeeper opens a downloaded copy without asking. Apple usually answers within
      # minutes; the team's first submission (v0.4.17) took 28, hence the long wait allowed here. The App Store Connect API key for it
      # exists only as secrets of this repository (docs/conventions.md, Release first); without them
      # (a fork) the app ships signed but not notarized, and macOS asks once on the first launch.
      - name: Notarize
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          case "$SIGN_IDENTITY" in
            "Developer ID Application:"*) ;;
            *) echo "::warning::not notarized: the app is not signed with a Developer ID"; exit 0 ;;
          esac
          if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::warning::secrets NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER_ID are missing: the app is not notarized, so macOS asks once before opening a downloaded copy (docs/conventions.md)"
            exit 0
          fi
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_KEY" > "$KEY"
          ditto -c -k --keepParent "dist/$APP_NAME.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notarize.json" || true
          cat "$RUNNER_TEMP/notarize.json"; echo
          STATUS="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$RUNNER_TEMP/notarize.json" 2>/dev/null || true)"
          SUBMISSION="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$RUNNER_TEMP/notarize.json" 2>/dev/null || true)"
          if [ "$STATUS" != "Accepted" ]; then
            # Apple's reasons, when it got as far as a verdict.
            [ -z "$SUBMISSION" ] || xcrun notarytool log "$SUBMISSION" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            rm -f "$KEY"
            echo "::error::notarization ended with status '$STATUS'"
            exit 1
          fi
          rm -f "$KEY"
          xcrun stapler staple "dist/$APP_NAME.app"
          xcrun stapler validate "dist/$APP_NAME.app"
          # Gatekeeper's own verdict on the stapled app: it must be a notarized Developer ID app.
          spctl -a -vv -t exec "dist/$APP_NAME.app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"

      # The app and its symbols (prepared by the build job), each zipped, and their SHA-256.
      - name: Archive
        run: |
          ditto -c -k --keepParent "dist/$APP_NAME.app" "dist/$ZIP"
          APP_UUID="$(dwarfdump --uuid "dist/$APP_NAME.app/Contents/MacOS/finchgram" | awk '{print $2}')"
          SYMBOLS_UUID="$(dwarfdump --uuid dist/finchgram.dSYM/Contents/Resources/DWARF/finchgram | awk '{print $2}')"
          [ -n "$APP_UUID" ] && [ "$APP_UUID" = "$SYMBOLS_UUID" ] || { echo "::error::finchgram.dSYM ($SYMBOLS_UUID) is not the symbols of the binary in the app ($APP_UUID)"; exit 1; }
          (cd dist && ditto -c -k --keepParent finchgram.dSYM "$SYMBOLS" && rm -rf finchgram.dSYM)
          (cd dist && shasum -a 256 "$ZIP" "$SYMBOLS" > SHA256SUMS)

      # Ed25519 signature of SHA256SUMS; the app only installs releases it can verify with the
      # public key in release-signing.pub (crates/finchgram-release-sign/src/main.rs).
      - name: Sign the update
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::secret RELEASE_SIGNING_KEY is missing (docs/conventions.md, Release first)"
            exit 1
          fi
          cargo run --locked --quiet -p finchgram-release-sign -- sign dist/SHA256SUMS
          cargo run --locked --quiet -p finchgram-release-sign -- verify dist/SHA256SUMS release-signing.pub
          ls -la dist

      # A run started by hand publishes nothing: its files are kept as an artifact, for three days.
      # A release's are on its release page, so no copy of them is kept here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.build.outputs.tag == ''
        with:
          name: finchgram-${{ needs.build.outputs.version }}-macos-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          retention-days: 3

      # ---- the rest only for a tagged commit ------------------------------------------------

      - name: Release notes
        if: needs.build.outputs.tag != ''
        run: |
          # The tag message holds the notes (scripts/release.sh), in English. The app shows only
          # what comes before the first "---" line (src/update.rs); the footer below is for the
          # release page.
          git fetch --force --tags --quiet origin
          git tag -l --format='%(contents)' "$TAG" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          [ -s notes.md ] || echo "$APP_NAME $VERSION." > notes.md
          cat >> notes.md <<NOTES

          ---
          **This release contains** \`$ZIP\` (the app, with finchgram-tdlib and libmpv inside), \`$SYMBOLS\` (the app's symbols, which read a crash report of this version: docs/crash-reports.md), \`SHA256SUMS\` and \`SHA256SUMS.sig\` (its Ed25519 signature, which the app checks before installing). The "Source code" archives below are this repository at \`$TAG\`.
          NOTES
          cat notes.md

      # --latest: installed copies look for the latest release (src/update.rs); tdlib-* releases
      # are published with --latest=false and never take its place.
      - name: Publish
        if: needs.build.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest --title "$APP_NAME $VERSION" \
            --notes-file notes.md "dist/$ZIP" "dist/$SYMBOLS" dist/SHA256SUMS dist/SHA256SUMS.sig
          echo "released **$TAG**: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # The build job's bundle is no longer needed once all went well (Actions storage, above).
      - name: Delete the build's artifact
        if: success() && needs.build.outputs.unsigned != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.build.outputs.unsigned }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT"
