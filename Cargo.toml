[package]
name = "finchgram"
version = "0.7.5"
edition = "2024"
rust-version = "1.92"
description = "FinchGram — an open-source Telegram desktop client with superpowers"
license = "GPL-3.0-only"
repository = "https://github.com/FinchGram/FinchGram"
publish = false

# The release signing tool is a package of its own (crates/finchgram-release-sign/), so that the
# release workflow's signing job builds it alone (.github/workflows/release.yml). Plain cargo
# commands at the top still mean the app; `--workspace` takes the tool in too.
[workspace]
members = ["crates/finchgram-release-sign"]

[dependencies]
# ~1.18: minor upgrades are deliberate. The unstable-* features (the transparent title bar, the
# bundled fonts, src/main.rs and src/fonts.rs) may change in any minor release.
slint = { version = "~1.18", features = ["unstable-winit-030", "unstable-fontique-011"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"                                      # settings file
dirs = "7"
sys-locale = "0.3"
chrono = "0.4"                                  # local times of messages (Slint uses it already)
qrcode = { version = "0.14", default-features = false }   # the QR code for logging in
# Pictures in messages, decoded off the UI thread (src/images.rs); Slint uses the same crates.
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
base64 = "0.23"                                 # TDLib's bytes (a photo's tiny preview)
glow = "0.18"                                   # the video's OpenGL texture (src/player/); Slint's renderer uses it too
# The self-updater (src/update.rs) and the release signing tool (src/bin/).
ureq = "3"
semver = "1"
# WebDAV (src/downloads/): PROPFIND answers are XML; roxmltree is in the tree already (resvg).
roxmltree = "0.21"
# The downloads' HTTP client (src/downloads/http.rs): hyper, HTTP/2 where a server offers it, on a
# tokio runtime of its own. The one async corner of the app (docs/architecture.md, Threads); TLS
# through rustls with the platform's trust store, so a certificate trusted in the Keychain passes.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "ring", "rustls-platform-verifier"] }
http-body-util = "0.1"
bytes = "1"
sha2 = "0.11"
ed25519-dalek = "3"
hex = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# The password column of the database is sealed with AES-256-GCM under the key in the Keychain
# (src/database.rs); ring is already here through rustls.
ring = "0.17"
# The downloads page's other protocols (docs/downloads.md): SFTP over russh, SSH in Rust on the
# downloads' tokio runtime; FTP and FTPS over suppaftp, blocking, with TLS through rustls.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
suppaftp = { version = "12", default-features = false, features = ["rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# Voice input (src/speech/, docs/voice-input.md): the realtime speech services' WebSockets
# (OpenAI's, Qwen's, Doubao's), tungstenite in its blocking form over a rustls stream of our own
# (the platform's trust store, as every other connection), one thread per dictation.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Doubao's answers (src/speech/doubao.rs) may come gzipped; flate2 is in the tree already (ureq, russh).
flate2 = "1"

[dev-dependencies]
# The HTTP/2 server of the transfer engine's test (src/downloads/transfer.rs).
hyper = { version = "1", features = ["server"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock, Quit, the menu bar icon, launching at login, the clipboard and notifications
# (src/platform/macos.rs); Slint's winit backend uses the same crates, and resvg draws its SVG images.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "objc2-core-foundation", "NSArray", "NSBundle", "NSData", "NSDate", "NSDictionary", "NSError", "NSGeometry",
    "NSLocale", "NSObjCRuntime", "NSProcessInfo", "NSRange", "NSString", "NSURL", "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSCursor", "NSDockTile",
    "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPasteboardItem",
    "NSResponder", "NSSavePanel", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow",
    "NSWorkspace",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest",
    "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter",
] }
resvg = { version = "0.48", default-features = false, features = ["text"] }   # also draws the screenshot tool's annotations into the picture
# The Keychain, for the database's key (src/platform/macos.rs), and the code signature of a program
# connecting to the MCP server (src/mcp/peer.rs); the same objc2 family.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFData", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-security = { version = "0.3", default-features = false, features = ["std", "CSCommon", "SecBase", "SecCode", "SecItem", "SecRequirement", "SecStaticCode"] }
# The microphone (src/platform/microphone.rs): AVAudioEngine's input node with a tap on it for
# voice input, AVAudioRecorder for voice messages (it writes AAC in an M4A file itself), and
# AVFoundation's question whether FinchGram may listen; the same objc2 family.
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std", "block2", "AVAudioBuffer", "AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioNode", "AVAudioRecorder", "AVAudioSettings",
    "AVAudioTime", "AVAudioTypes",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
# Pictures the image crate cannot read (HEIC, TIFF, GIF, AVIF, …), for a chat's photo
# (src/platform/macos.rs): ImageIO reads them, turned the way they were taken, and Core Graphics
# draws them into pixels; the same objc2 family.
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }

[build-dependencies]
slint-build = "~1.18"

[profile.release]
strip = true
lto = "thin"
# The names and line tables go into finchgram.dSYM next to the binary (dsymutil, at link time),
# which the release keeps for reading crash reports (docs/crash-reports.md); the binary itself
# carries none of it and stays stripped.
debug = "line-tables-only"
split-debuginfo = "packed"
